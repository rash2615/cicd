# Configuration générale
sonar.projectKey=e-commerce-microservices
sonar.projectName=E-commerce Microservices
sonar.projectVersion=1.0

# Sources
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/tests/**

# Tests
sonar.tests=.
sonar.test.inclusions=**/tests/**/*.js,**/tests/**/*.ts
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.coverage.exclusions=**/tests/**,**/node_modules/**

# Qualité du code
sonar.qualitygate.wait=true
sonar.qualitygate.conditions=coverage,duplicated_lines_density,reliability_rating,security_rating,maintainability_rating

# Seuils de qualité
sonar.coverage.minimum=80
sonar.duplicated_lines_density.maximum=3
sonar.reliability_rating.minimum=A
sonar.security_rating.minimum=A
sonar.maintainability_rating.minimum=A

# Langages
sonar.language=js,ts
sonar.javascript.file.suffixes=js,jsx,ts,tsx

sonar.sourceEncoding=UTF-8 